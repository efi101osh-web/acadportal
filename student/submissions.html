<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Submissions — AcadPortal Student</title>
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/student.css" />
</head>
<body>
  <div id="toast-container"></div>
  <div class="student-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <a href="dashboard.html" class="sidebar-brand"><div class="sidebar-brand-icon">A</div><span class="sidebar-brand-text">Acad<em>Portal</em></span></a>
        <button class="sidebar-toggle" onclick="toggleSidebar()">☰</button>
      </div>
      <div class="sidebar-user">
        <div class="sidebar-avatar" id="sidebar-avatar">?</div>
        <div class="sidebar-user-info"><div class="name" id="sidebar-name">Loading...</div><div class="level" id="sidebar-level">— Level</div></div>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section-label">Main</div>
        <a href="dashboard.html" class="nav-link" data-title="Dashboard"><span class="nav-icon">🏠</span><span class="nav-text">Dashboard</span></a>
        <a href="notes.html" class="nav-link" data-title="Notes"><span class="nav-icon">📚</span><span class="nav-text">Lecture Notes</span></a>
        <a href="assignments.html" class="nav-link" data-title="Assignments"><span class="nav-icon">📝</span><span class="nav-text">Assignments</span></a>
        <div class="nav-section-label">My Records</div>
        <a href="submissions.html" class="nav-link active" data-title="Submissions"><span class="nav-icon">📤</span><span class="nav-text">My Submissions</span></a>
        <a href="scores.html" class="nav-link" data-title="Scores"><span class="nav-icon">🎯</span><span class="nav-text">My Scores</span></a>
        <div class="nav-section-label">Account</div>
        <a href="notifications.html" class="nav-link" data-title="Notifications"><span class="nav-icon">🔔</span><span class="nav-text">Notifications</span><span class="nav-badge" id="nav-notif-count" style="display:none">0</span></a>
        <a href="profile.html" class="nav-link" data-title="Profile"><span class="nav-icon">👤</span><span class="nav-text">My Profile</span></a>
      </nav>
      <div class="sidebar-bottom"><button class="sidebar-logout" onclick="handleLogout()"><span class="nav-icon">🚪</span><span>Logout</span></button></div>
    </aside>
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeMobileSidebar()"></div>

    <main class="student-main">
      <div class="student-topbar">
        <div class="topbar-left">
          <button class="mobile-menu-btn" onclick="openMobileSidebar()">☰</button>
          <span class="topbar-page-title">My Submissions</span>
        </div>
        <div class="topbar-right">
          <button class="topbar-notif-btn" onclick="window.location.href='notifications.html'">🔔<span class="notif-count" id="notif-count" style="display:none">0</span></button>
          <div class="topbar-avatar" id="topbar-avatar" onclick="window.location.href='profile.html'">?</div>
        </div>
      </div>

      <div class="student-content">
        <h2 class="section-title">📤 My Submissions</h2>
        <div class="card">
          <div id="submissions-container">
            <div class="text-center" style="padding:60px"><div class="spinner-inline"></div></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { requireAuth, logoutUser, getUserProfile } from "../js/auth.js";
    import { getMySubmissions } from "../js/student.js";
    import { getUnreadCount } from "../js/notifications.js";
    import { formatDateTime, getInitials, formatLevel, updateNotifBadge, getFileIcon } from "../js/utils.js";

    async function init() {
      try {
        const currentUser = await requireAuth("student");
        const profile = await getUserProfile(currentUser.uid);
        if (!profile) { window.location.href = "/student/login.html"; return; }
        const initials = getInitials(profile.fullName);
        document.getElementById("sidebar-name").textContent = profile.fullName;
        document.getElementById("sidebar-level").textContent = formatLevel(profile.level);
        document.getElementById("sidebar-avatar").textContent = initials;
        document.getElementById("topbar-avatar").textContent = initials;
        const count = await getUnreadCount(currentUser.uid, profile.level);
        updateNotifBadge(count);

        const submissions = await getMySubmissions(currentUser.uid);
        const container = document.getElementById("submissions-container");

        if (!submissions.length) {
          container.innerHTML = `<div class="empty-state"><span class="empty-icon">📤</span><h4>No submissions yet</h4><p>You haven't submitted any assignments yet. Go to <a href="assignments.html">Assignments</a> to submit.</p></div>`;
          return;
        }

        container.innerHTML = `
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Assignment</th>
                  <th>Course</th>
                  <th>Submitted</th>
                  <th>Status</th>
                  <th>File / Text</th>
                  <th>Score</th>
                  <th>Remark</th>
                </tr>
              </thead>
              <tbody>
                ${submissions.map(s => `
                  <tr class="${s.isLate ? "submission-row-late" : ""}">
                    <td><strong>${s.assignmentTitle}</strong></td>
                    <td><span class="badge badge-navy">${s.courseCode}</span></td>
                    <td style="font-size:12px">${formatDateTime(s.submittedAt)}</td>
                    <td>
                      ${s.isLate
                        ? `<span class="badge badge-late">⏰ Late</span>`
                        : `<span class="badge badge-success">✅ On Time</span>`}
                    </td>
                    <td>
                      ${s.fileUrl ? `<a href="${s.fileUrl}" target="_blank" class="btn btn-outline btn-sm">${getFileIcon(s.fileName)} Download</a>` : ""}
                      ${s.textContent ? `<span class="badge badge-navy" title="${s.textContent.slice(0,100)}">📄 Text</span>` : ""}
                      ${!s.fileUrl && !s.textContent ? "—" : ""}
                    </td>
                    <td>
                      ${s.graded
                        ? `<span class="fw-800" style="color:var(--navy);font-size:16px">${s.score}</span>`
                        : `<span class="text-muted" style="font-size:12px">Pending</span>`}
                    </td>
                    <td style="font-size:13px;color:var(--text-mid);max-width:200px">${s.remark || "—"}</td>
                  </tr>`).join("")}
              </tbody>
            </table>
          </div>
          <p style="font-size:12px;color:var(--text-muted);margin-top:12px;padding:0 4px">
            Total: ${submissions.length} submission${submissions.length !== 1 ? "s" : ""} · 
            Graded: ${submissions.filter(s => s.graded).length} · 
            Late: ${submissions.filter(s => s.isLate).length}
          </p>`;
      } catch(e) {}
    }

    window.handleLogout = async () => { await logoutUser(); window.location.href = "/student/login.html"; };
    window.toggleSidebar = () => document.getElementById("sidebar").classList.toggle("collapsed");
    window.openMobileSidebar = () => { document.getElementById("sidebar").classList.add("mobile-open"); document.getElementById("sidebar-overlay").style.display = "block"; };
    window.closeMobileSidebar = () => { document.getElementById("sidebar").classList.remove("mobile-open"); document.getElementById("sidebar-overlay").style.display = "none"; };
    init();
  </script>
</body>
</html>
