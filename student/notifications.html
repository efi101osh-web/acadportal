<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notifications — AcadPortal Student</title>
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/student.css" />
</head>
<body>
  <div id="toast-container"></div>
  <div class="student-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <a href="dashboard.html" class="sidebar-brand"><div class="sidebar-brand-icon">A</div><span class="sidebar-brand-text">Acad<em>Portal</em></span></a>
        <button class="sidebar-toggle" onclick="toggleSidebar()">☰</button>
      </div>
      <div class="sidebar-user">
        <div class="sidebar-avatar" id="sidebar-avatar">?</div>
        <div class="sidebar-user-info"><div class="name" id="sidebar-name">Loading...</div><div class="level" id="sidebar-level">— Level</div></div>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section-label">Main</div>
        <a href="dashboard.html" class="nav-link" data-title="Dashboard"><span class="nav-icon">🏠</span><span class="nav-text">Dashboard</span></a>
        <a href="notes.html" class="nav-link" data-title="Notes"><span class="nav-icon">📚</span><span class="nav-text">Lecture Notes</span></a>
        <a href="assignments.html" class="nav-link" data-title="Assignments"><span class="nav-icon">📝</span><span class="nav-text">Assignments</span></a>
        <div class="nav-section-label">My Records</div>
        <a href="submissions.html" class="nav-link" data-title="Submissions"><span class="nav-icon">📤</span><span class="nav-text">My Submissions</span></a>
        <a href="scores.html" class="nav-link" data-title="Scores"><span class="nav-icon">🎯</span><span class="nav-text">My Scores</span></a>
        <div class="nav-section-label">Account</div>
        <a href="notifications.html" class="nav-link active" data-title="Notifications"><span class="nav-icon">🔔</span><span class="nav-text">Notifications</span></a>
        <a href="profile.html" class="nav-link" data-title="Profile"><span class="nav-icon">👤</span><span class="nav-text">My Profile</span></a>
      </nav>
      <div class="sidebar-bottom"><button class="sidebar-logout" onclick="handleLogout()"><span class="nav-icon">🚪</span><span>Logout</span></button></div>
    </aside>
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeMobileSidebar()"></div>

    <main class="student-main">
      <div class="student-topbar">
        <div class="topbar-left">
          <button class="mobile-menu-btn" onclick="openMobileSidebar()">☰</button>
          <span class="topbar-page-title">Notifications</span>
        </div>
        <div class="topbar-right">
          <button class="topbar-notif-btn" onclick="window.location.href='notifications.html'">🔔<span class="notif-count" id="notif-count" style="display:none">0</span></button>
          <div class="topbar-avatar" id="topbar-avatar" onclick="window.location.href='profile.html'">?</div>
        </div>
      </div>

      <div class="student-content">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
          <h2 class="section-title" style="margin:0">🔔 Notifications</h2>
          <button class="btn btn-outline btn-sm" onclick="markAllRead()">✅ Mark All Read</button>
        </div>
        <div id="notif-list">
          <div class="text-center" style="padding:60px"><div class="spinner-inline"></div></div>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { requireAuth, logoutUser, getUserProfile } from "../js/auth.js";
    import { getStudentNotifications, markNotificationRead, markAllRead as markAllReadFn, getUnreadCount } from "../js/notifications.js";
    import { getInitials, formatLevel, formatRelativeTime, updateNotifBadge } from "../js/utils.js";

    let currentUser, profile;

    async function init() {
      try {
        currentUser = await requireAuth("student");
        profile = await getUserProfile(currentUser.uid);
        if (!profile) { window.location.href = "/student/login.html"; return; }
        const initials = getInitials(profile.fullName);
        document.getElementById("sidebar-name").textContent = profile.fullName;
        document.getElementById("sidebar-level").textContent = formatLevel(profile.level);
        document.getElementById("sidebar-avatar").textContent = initials;
        document.getElementById("topbar-avatar").textContent = initials;
        await loadNotifs();
      } catch(e) {}
    }

    async function loadNotifs() {
      const notifs = await getStudentNotifications(currentUser.uid, profile.level);
      const unread = notifs.filter(n => !n.isRead).length;
      updateNotifBadge(unread);

      const icons = { note: "📚", assignment: "📝", score: "🎯", info: "ℹ️" };
      const container = document.getElementById("notif-list");

      if (!notifs.length) {
        container.innerHTML = `<div class="empty-state"><span class="empty-icon">🔔</span><h4>No notifications yet</h4><p>You'll be notified here whenever notes or assignments are posted for ${formatLevel(profile.level)}.</p></div>`;
        return;
      }

      container.innerHTML = notifs.map(n => `
        <div class="notif-item ${n.isRead ? "" : "unread"}" id="notif-${n.id}" style="cursor:pointer" onclick="readNotif('${n.id}', event)">
          <div class="notif-dot"></div>
          <div style="flex:1">
            <div class="notif-title">${icons[n.type] || "🔔"} ${n.title}</div>
            <div class="notif-msg">${n.message}</div>
            <div class="notif-time">${formatRelativeTime(n.createdAt)}</div>
          </div>
          ${!n.isRead ? `<span class="badge badge-navy" style="font-size:10px;flex-shrink:0">NEW</span>` : ""}
        </div>`).join("");
    }

    window.readNotif = async function(id, e) {
      try {
        await markNotificationRead(id, currentUser.uid);
        const el = document.getElementById(`notif-${id}`);
        if (el) { el.classList.remove("unread"); const badge = el.querySelector(".badge"); if (badge) badge.remove(); }
        const count = await getUnreadCount(currentUser.uid, profile.level);
        updateNotifBadge(count);
      } catch(e) {}
    };

    window.markAllRead = async function() {
      try {
        await markAllReadFn(currentUser.uid, profile.level);
        updateNotifBadge(0);
        await loadNotifs();
      } catch(e) {}
    };

    window.handleLogout = async () => { await logoutUser(); window.location.href = "/student/login.html"; };
    window.toggleSidebar = () => document.getElementById("sidebar").classList.toggle("collapsed");
    window.openMobileSidebar = () => { document.getElementById("sidebar").classList.add("mobile-open"); document.getElementById("sidebar-overlay").style.display = "block"; };
    window.closeMobileSidebar = () => { document.getElementById("sidebar").classList.remove("mobile-open"); document.getElementById("sidebar-overlay").style.display = "none"; };
    init();
  </script>
</body>
</html>
