<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — AcadPortal</title>
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/auth.css" />
</head>
<body>
  <div id="toast-container"></div>
  <main class="auth-page">
    <div class="auth-card" style="max-width:780px">
      <div class="auth-left">
        <div class="auth-logo">
          <div class="logo-icon">A</div>
          <span>Acad<em>Portal</em></span>
        </div>
        <h1 class="auth-title">Reset Password</h1>
        <p class="auth-subtitle">Enter your email and we'll send a reset link</p>
        <div id="alert-area"></div>
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <div class="input-icon-wrap">
            <span class="icon">✉️</span>
            <input type="email" id="email" class="form-control" placeholder="your@email.com" />
          </div>
        </div>
        <button class="btn btn-primary btn-block btn-lg" id="reset-btn" onclick="handleReset()">📨 Send Reset Link</button>
        <div class="auth-footer-link">
          Remember your password? <a href="login.html">Log in</a>
        </div>
      </div>
      <div class="auth-right">
        <div class="auth-brand">
          <div class="auth-brand-logo"><span class="logo-letter">A</span></div>
          <h2>Acad<span>Portal</span></h2>
          <p class="univ-name">University of Calabar</p>
          <p class="auth-brand-desc">A password reset link will be sent to your registered email address. Check your inbox and spam folder.</p>
          <a href="../index.html" class="auth-home-btn">🏠 Home</a>
        </div>
      </div>
    </div>
  </main>
  <script type="module">
    import { sendReset } from "../js/auth.js";
    import { showToast } from "../js/utils.js";
    window.handleReset = async function() {
      const email = document.getElementById("email").value.trim();
      const alertArea = document.getElementById("alert-area");
      const btn = document.getElementById("reset-btn");
      alertArea.innerHTML = "";
      if (!email || !email.includes("@")) {
        alertArea.innerHTML = `<div class="alert alert-danger">❌ Enter a valid email address.</div>`;
        return;
      }
      btn.disabled = true; btn.innerHTML = `<span class="spinner-inline"></span> Sending...`;
      try {
        await sendReset(email);
        alertArea.innerHTML = `<div class="alert alert-success">✅ Reset link sent! Check your email inbox and spam folder.</div>`;
        btn.innerHTML = "✅ Email Sent";
      } catch(e) {
        btn.disabled = false; btn.innerHTML = "📨 Send Reset Link";
        alertArea.innerHTML = `<div class="alert alert-danger">❌ ${e.message || "Failed to send reset email."}</div>`;
      }
    };
  </script>
</body>
</html>
